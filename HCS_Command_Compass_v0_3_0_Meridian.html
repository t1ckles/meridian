<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCS Command Compass · v0.3.0 "Meridian"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #020408; --bg-deep: #050c14; --bg-panel: #07111d;
    --bg-card: #0a1a28; --bg-card-hover: #0e2235;
    --accent-cyan: #00d4ff; --accent-gold: #f0c040;
    --accent-red: #ff4444; --accent-green: #00ff88;
    --text-primary: #c8dce8; --text-secondary: #6a8fa8; --text-dim: #344d60;
    --border-primary: rgba(0,212,255,0.25); --border-dim: rgba(0,212,255,0.08);
    --glow-cyan: 0 0 20px rgba(0,212,255,0.3); --glow-gold: 0 0 20px rgba(240,192,64,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Rajdhani',sans-serif; background:var(--bg-void); color:var(--text-primary); min-height:100vh; overflow-x:hidden; }

  #starfield { position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(ellipse at 20% 30%,#0a1a28 0%,#020408 60%); }
  #starfield canvas { width:100%; height:100%; }

  /* ENTER SCREEN */
  #enter-screen { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg-void); transition:opacity 0.8s ease,visibility 0.8s ease; }
  #enter-screen.hidden { opacity:0; visibility:hidden; }
  .enter-bg-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px); background-size:60px 60px; animation:gridScroll 20s linear infinite; }
  @keyframes gridScroll { from { background-position:0 0 } to { background-position:60px 60px } }
  .enter-glow-orb { position:absolute; border-radius:50%; filter:blur(80px); animation:orbPulse 6s ease-in-out infinite; }
  .enter-glow-orb.a { width:500px; height:500px; background:radial-gradient(circle,rgba(0,212,255,0.08) 0%,transparent 70%); top:20%; left:15%; animation-delay:0s; }
  .enter-glow-orb.b { width:400px; height:400px; background:radial-gradient(circle,rgba(240,192,64,0.06) 0%,transparent 70%); bottom:20%; right:15%; animation-delay:3s; }
  @keyframes orbPulse { 0%,100% { opacity:0.6; transform:scale(1) } 50% { opacity:1; transform:scale(1.15) } }
  .enter-content { position:relative; z-index:2; text-align:center; animation:enterFadeIn 1.5s ease forwards; }
  @keyframes enterFadeIn { from { opacity:0; transform:translateY(30px) } to { opacity:1; transform:translateY(0) } }
  .enter-insignia { width:100px; height:100px; margin:0 auto 32px; }
  .enter-insignia svg { width:100%; height:100%; }
  .enter-version { margin-top:20px; font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:3px; color:var(--text-dim); text-transform:uppercase; }
  .enter-label { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-secondary); letter-spacing:6px; text-transform:uppercase; margin-bottom:12px; animation:labelBlink 3s ease-in-out infinite; }
  @keyframes labelBlink { 0%,100% { opacity:0.6 } 50% { opacity:1 } }
  .enter-title { font-family:'Orbitron',monospace; font-size:clamp(36px,7vw,72px); font-weight:900; color:#fff; letter-spacing:4px; line-height:1; text-shadow:0 0 40px rgba(0,212,255,0.5),0 0 80px rgba(0,212,255,0.2); margin-bottom:8px; }
  .enter-subtitle { font-family:'Orbitron',monospace; font-size:clamp(14px,2.5vw,20px); font-weight:400; color:var(--accent-cyan); letter-spacing:8px; text-transform:uppercase; margin-bottom:48px; opacity:0.8; }
  .enter-stats { display:flex; gap:48px; justify-content:center; margin-bottom:56px; }
  .enter-stat { text-align:center; }
  .enter-stat-val { font-family:'Orbitron',monospace; font-size:28px; font-weight:700; color:var(--accent-gold); text-shadow:var(--glow-gold); display:block; }
  .enter-stat-lbl { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-secondary); letter-spacing:3px; text-transform:uppercase; margin-top:4px; }
  .enter-divider { width:1px; height:48px; background:linear-gradient(to bottom,transparent,var(--accent-cyan),transparent); opacity:0.3; }
  .enter-btn { position:relative; display:inline-flex; align-items:center; gap:16px; padding:18px 48px; font-family:'Orbitron',monospace; font-size:14px; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:#fff; background:transparent; border:1px solid var(--accent-cyan); cursor:pointer; clip-path:polygon(16px 0%,100% 0%,calc(100% - 16px) 100%,0% 100%); transition:all 0.3s ease; overflow:hidden; }
  .enter-btn::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(0,212,255,0.15),transparent); transform:translateX(-100%); transition:transform 0.5s ease; }
  .enter-btn:hover::before { transform:translateX(100%); }
  .enter-btn:hover { background:rgba(0,212,255,0.1); box-shadow:var(--glow-cyan),inset 0 0 20px rgba(0,212,255,0.05); color:var(--accent-cyan); }
  .enter-btn-arrow { font-size:18px; transition:transform 0.3s ease; }
  .enter-btn:hover .enter-btn-arrow { transform:translateX(4px); }
  .enter-corner { position:absolute; width:20px; height:20px; border-color:var(--accent-cyan); border-style:solid; opacity:0.4; }
  .enter-corner.tl { top:-2px; left:-2px; border-width:2px 0 0 2px; }
  .enter-corner.tr { top:-2px; right:-2px; border-width:2px 2px 0 0; }
  .enter-corner.bl { bottom:-2px; left:-2px; border-width:0 0 2px 2px; }
  .enter-corner.br { bottom:-2px; right:-2px; border-width:0 2px 2px 0; }
  .enter-scan-line { position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent-cyan),transparent); opacity:0.4; animation:scanLine 4s linear infinite; }
  @keyframes scanLine { from { top:0; opacity:0 } 10% { opacity:0.4 } 90% { opacity:0.4 } to { top:100%; opacity:0 } }

  /* MAIN APP */
  #app { position:relative; z-index:10; min-height:100vh; opacity:0; transition:opacity 0.8s ease 0.2s; }
  #app.visible { opacity:1; }
  .app-header { position:sticky; top:0; z-index:50; padding:0 32px; height:64px; display:flex; align-items:center; justify-content:space-between; background:rgba(2,4,8,0.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border-primary); }
  .header-brand { display:flex; align-items:center; gap:16px; }
  .header-logo { width:32px; height:32px; opacity:0.9; }
  .header-title { font-family:'Orbitron',monospace; font-size:16px; font-weight:700; letter-spacing:3px; color:#fff; }
  .header-title span { color:var(--accent-cyan); }
  .header-version { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--text-dim); margin-top:3px; }
  .header-nav { display:flex; align-items:center; gap:24px; }
  .header-stat { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-secondary); letter-spacing:2px; }
  .header-stat strong { color:var(--accent-gold); font-size:14px; }
  .back-btn { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-secondary); letter-spacing:2px; text-transform:uppercase; background:none; border:1px solid var(--border-dim); padding:6px 16px; cursor:pointer; transition:all 0.2s ease; }
  .back-btn:hover { color:var(--accent-cyan); border-color:var(--border-primary); }

  .search-section { padding:48px 32px 32px; max-width:1400px; margin:0 auto; }
  .search-section-title { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-secondary); letter-spacing:4px; text-transform:uppercase; margin-bottom:24px; }
  .search-bar-wrap { position:relative; margin-bottom:24px; }
  .search-icon { position:absolute; left:20px; top:50%; transform:translateY(-50%); color:var(--text-secondary); font-size:16px; pointer-events:none; }
  #search-input { width:100%; padding:18px 24px 18px 52px; font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--text-primary); background:var(--bg-panel); border:1px solid var(--border-primary); outline:none; transition:all 0.3s ease; clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%); }
  #search-input::placeholder { color:var(--text-dim); }
  #search-input:focus { border-color:var(--accent-cyan); box-shadow:var(--glow-cyan); background:var(--bg-card); }

  .search-mode-tabs { display:flex; gap:4px; margin-bottom:32px; flex-wrap:wrap; }
  .mode-tab { padding:10px 24px; font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--text-secondary); background:transparent; border:1px solid var(--border-dim); cursor:pointer; transition:all 0.25s ease; clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%); }
  .mode-tab.active { color:var(--accent-cyan); background:rgba(0,212,255,0.08); border-color:var(--accent-cyan); box-shadow:var(--glow-cyan); }
  .mode-tab:hover:not(.active) { color:var(--text-primary); border-color:var(--border-primary); }

  .filter-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .filter-chip { padding:6px 14px; font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:1.5px; color:var(--text-secondary); background:var(--bg-panel); border:1px solid var(--border-dim); cursor:pointer; transition:all 0.2s ease; clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%); }
  .filter-chip.active { color:var(--accent-gold); border-color:rgba(240,192,64,0.4); background:rgba(240,192,64,0.08); }
  .filter-chip:hover:not(.active) { color:var(--text-primary); border-color:var(--border-primary); }

  .results-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .results-count { font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--text-secondary); letter-spacing:2px; }
  .results-count span { color:var(--accent-cyan); font-size:16px; font-weight:bold; }
  .sort-btn { display:flex; align-items:center; gap:8px; padding:8px 16px; font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-secondary); letter-spacing:2px; background:var(--bg-panel); border:1px solid var(--border-dim); cursor:pointer; transition:all 0.2s ease; }
  .sort-btn:hover { color:var(--text-primary); border-color:var(--border-primary); }

  .commands-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .cmd-card { background:var(--bg-card); border:1px solid var(--border-dim); padding:0; cursor:pointer; transition:all 0.3s ease; position:relative; overflow:hidden; clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px)); animation:cardIn 0.4s ease forwards; opacity:0; }
  @keyframes cardIn { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
  .cmd-card:hover { border-color:var(--border-primary); background:var(--bg-card-hover); transform:translateY(-2px); box-shadow:0 8px 32px rgba(0,0,0,0.4),var(--glow-cyan); }
  .cmd-card-accent { position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent-cyan),transparent); opacity:0; transition:opacity 0.3s ease; }
  .cmd-card:hover .cmd-card-accent { opacity:1; }
  .cmd-card-corner { position:absolute; top:0; right:0; width:20px; height:20px; background:linear-gradient(135deg,var(--accent-cyan) 0%,var(--accent-cyan) 50%,var(--bg-card) 50%); opacity:0.4; }
  .cmd-card:hover .cmd-card-corner { opacity:0.8; }
  .cmd-card-header { padding:16px 20px 0; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .cmd-category-badge { display:inline-block; padding:3px 10px; font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--accent-gold); background:rgba(240,192,64,0.08); border:1px solid rgba(240,192,64,0.2); clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%); }
  .cmd-card-body { padding:10px 20px 20px; }
  .cmd-name { font-family:'Orbitron',monospace; font-size:13px; font-weight:700; color:#fff; letter-spacing:0.5px; margin-bottom:10px; line-height:1.35; }
  .cmd-voice-phrases { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .cmd-phrase { font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--accent-cyan); opacity:0.85; display:flex; align-items:center; gap:6px; }
  .cmd-phrase::before { content:'▶'; font-size:8px; color:var(--accent-gold); opacity:0.6; flex-shrink:0; }
  .cmd-card-divider { height:1px; background:var(--border-dim); margin:10px 0; }
  .cmd-card-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .cmd-pack-badge { display:inline-block; padding:2px 10px; font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1px; clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%); color:#88aaff; background:rgba(136,170,255,0.08); border:1px solid rgba(136,170,255,0.2); }
  .cmd-id { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dim); letter-spacing:1px; }

  .group-section { margin-bottom:48px; }
  .group-header { display:flex; align-items:center; gap:16px; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border-dim); }
  .group-title { font-family:'Orbitron',monospace; font-size:18px; font-weight:700; color:#fff; letter-spacing:2px; }
  .group-count { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-secondary); letter-spacing:2px; }
  .group-line { flex:1; height:1px; background:linear-gradient(90deg,var(--border-primary),transparent); }

  .modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(2,4,8,0.92); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; visibility:hidden; transition:all 0.3s ease; }
  .modal-overlay.open { opacity:1; visibility:visible; }
  .modal-box { background:var(--bg-panel); border:1px solid var(--border-primary); max-width:640px; width:100%; max-height:90vh; overflow-y:auto; position:relative; clip-path:polygon(0 0,calc(100% - 32px) 0,100% 32px,100% 100%,32px 100%,0 calc(100% - 32px)); transform:scale(0.95); transition:transform 0.3s ease; box-shadow:0 0 60px rgba(0,212,255,0.15); }
  .modal-overlay.open .modal-box { transform:scale(1); }
  .modal-top-bar { height:3px; background:linear-gradient(90deg,transparent,var(--accent-cyan),var(--accent-gold),transparent); }
  .modal-header { padding:32px 32px 24px; border-bottom:1px solid var(--border-dim); }
  .modal-badge-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .modal-cmd-name { font-family:'Orbitron',monospace; font-size:20px; font-weight:900; color:#fff; letter-spacing:1.5px; margin-bottom:6px; text-shadow:0 0 30px rgba(255,255,255,0.2); line-height:1.25; }
  .modal-cmd-sub { font-family:'Rajdhani',sans-serif; font-size:14px; font-weight:500; color:var(--accent-cyan); letter-spacing:3px; text-transform:uppercase; }
  .modal-close { position:absolute; top:20px; right:20px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:none; border:1px solid var(--border-dim); color:var(--text-secondary); cursor:pointer; font-size:18px; transition:all 0.2s ease; clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%); }
  .modal-close:hover { color:var(--accent-red); border-color:rgba(255,68,68,0.4); }
  .modal-body { padding:24px 32px 32px; }
  .modal-section-label { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-secondary); letter-spacing:3px; text-transform:uppercase; margin-bottom:12px; border-left:2px solid var(--accent-cyan); padding-left:10px; }
  .modal-phrases-list { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  .modal-phrase-item { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--bg-card); border:1px solid var(--border-dim); font-family:'Share Tech Mono',monospace; font-size:13px; color:var(--accent-cyan); clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%); }
  .modal-phrase-item::before { content:'▶'; font-size:9px; color:var(--accent-gold); flex-shrink:0; }
  .modal-info-rows { display:flex; flex-direction:column; }
  .modal-info-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border-dim); }
  .modal-info-row:last-child { border-bottom:none; }
  .modal-info-key { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-secondary); letter-spacing:2px; text-transform:uppercase; }
  .modal-info-val { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; color:var(--text-primary); text-align:right; }

  .empty-state { text-align:center; padding:80px 32px; }
  .empty-icon { font-size:48px; opacity:0.3; margin-bottom:16px; }
  .empty-text { font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--text-dim); letter-spacing:3px; text-transform:uppercase; }
  .pagination { display:flex; justify-content:center; gap:6px; padding:32px 0 16px; flex-wrap:wrap; }
  .page-btn { padding:8px 16px; font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-secondary); letter-spacing:2px; background:var(--bg-panel); border:1px solid var(--border-dim); cursor:pointer; transition:all 0.2s ease; clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%); }
  .page-btn:hover:not(:disabled) { color:var(--text-primary); border-color:var(--border-primary); }
  .page-btn.active { color:var(--accent-cyan); border-color:var(--accent-cyan); background:rgba(0,212,255,0.08); box-shadow:var(--glow-cyan); }
  .page-btn:disabled { opacity:0.25; cursor:default; }
  .page-ellipsis { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-dim); padding:8px 4px; }
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background:var(--border-primary); }
</style>
</head>
<body>

<div id="starfield"><canvas id="stars-canvas"></canvas></div>

<!-- ENTER SCREEN -->
<div id="enter-screen">
  <div class="enter-bg-grid"></div>
  <div class="enter-glow-orb a"></div>
  <div class="enter-glow-orb b"></div>
  <div class="enter-scan-line"></div>
  <div class="enter-content">
    <div class="enter-label">HCS VoicePack · Neural Command Interface</div>
    <div class="enter-insignia">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs><radialGradient id="ig" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/><stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/></radialGradient></defs>
        <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
        <circle cx="50" cy="50" r="46" fill="url(#ig)"/>
        <polygon points="50,4 54,46 50,52 46,46" fill="none" stroke="rgba(0,212,255,0.7)" stroke-width="1.5"/>
        <polygon points="96,50 54,54 48,50 54,46" fill="none" stroke="rgba(0,212,255,0.7)" stroke-width="1.5"/>
        <polygon points="50,96 46,54 50,48 54,54" fill="none" stroke="rgba(0,212,255,0.7)" stroke-width="1.5"/>
        <polygon points="4,50 46,46 52,50 46,54" fill="none" stroke="rgba(0,212,255,0.7)" stroke-width="1.5"/>
        <line x1="22" y1="22" x2="40" y2="40" stroke="rgba(240,192,64,0.4)" stroke-width="1"/>
        <line x1="78" y1="22" x2="60" y2="40" stroke="rgba(240,192,64,0.4)" stroke-width="1"/>
        <line x1="78" y1="78" x2="60" y2="60" stroke="rgba(240,192,64,0.4)" stroke-width="1"/>
        <line x1="22" y1="78" x2="40" y2="60" stroke="rgba(240,192,64,0.4)" stroke-width="1"/>
        <circle cx="50" cy="50" r="10" fill="none" stroke="rgba(0,212,255,0.8)" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="3" fill="#00d4ff"/>
        <line x1="50" y1="2" x2="50" y2="10" stroke="rgba(0,212,255,0.6)" stroke-width="1.5"/>
        <line x1="50" y1="90" x2="50" y2="98" stroke="rgba(0,212,255,0.6)" stroke-width="1.5"/>
        <line x1="2" y1="50" x2="10" y2="50" stroke="rgba(0,212,255,0.6)" stroke-width="1.5"/>
        <line x1="90" y1="50" x2="98" y2="50" stroke="rgba(0,212,255,0.6)" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="enter-title">COMMAND COMPASS</div>
    <div class="enter-subtitle">Voice Command Database</div>
    <div class="enter-stats">
      <div class="enter-stat"><span class="enter-stat-val">745</span><div class="enter-stat-lbl">Commands</div></div>
      <div class="enter-divider"></div>
      <div class="enter-stat"><span class="enter-stat-val">2580</span><div class="enter-stat-lbl">Phrases</div></div>
      <div class="enter-divider"></div>
      <div class="enter-stat"><span class="enter-stat-val">18</span><div class="enter-stat-lbl">Categories</div></div>
    </div>
    <button class="enter-btn" onclick="enterApp()">
      <div class="enter-corner tl"></div><div class="enter-corner tr"></div>
      <div class="enter-corner bl"></div><div class="enter-corner br"></div>

let currentMode = 'all', activeFilter = 'all', sortKey = 'name', sortDir = 1, currentPage = 1;
const PAGE_SIZE = 18;
let filtered = [];

function enterApp() {
  document.getElementById('enter-screen').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  renderApp();
}
function goBack() {
  document.getElementById('enter-screen').classList.remove('hidden');
  document.getElementById('app').classList.remove('visible');
}
function setMode(mode, btn) {
  currentMode = mode; activeFilter = 'all'; currentPage = 1;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderApp();
}
function setFilter(val) { activeFilter = val; currentPage = 1; renderApp(); }

const SORT_KEYS = ['name', 'category', 'pack'];
const SORT_LABELS = ['NAME', 'CATEGORY', 'CHARACTER'];
function cycleSort() {
  const idx = SORT_KEYS.indexOf(sortKey);
  if (idx === SORT_KEYS.length - 1) { sortDir *= -1; }
  else { sortKey = SORT_KEYS[idx + 1]; }
  document.getElementById('sort-label').textContent = SORT_LABELS[SORT_KEYS.indexOf(sortKey)];
  currentPage = 1; renderApp();
}

function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase();
  return COMMANDS
    .filter(c => {
      const mQ = !q || c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q)
        || c.pack.toLowerCase().includes(q) || c.phrases.some(p => p.toLowerCase().includes(q));
      const mF = activeFilter === 'all'
        || (currentMode === 'category' && c.category === activeFilter)
        || (currentMode === 'character' && c.pack === activeFilter);
      return mQ && mF;
    })
    .sort((a, b) => {
      const av = a[sortKey].toLowerCase(), bv = b[sortKey].toLowerCase();
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
}

function renderApp() {
  filtered = getFiltered();
  document.getElementById('result-count').textContent = filtered.length;
  document.getElementById('h-count').textContent = filtered.length;
  renderFilterArea(); renderResults(); renderPagination();
}

function renderFilterArea() {
  const area = document.getElementById('filter-area');
  if (currentMode === 'all') { area.innerHTML = ''; return; }
  const key = currentMode === 'category' ? 'category' : 'pack';
  const values = [...new Set(COMMANDS.map(c => c[key]))].sort();
  let html = '<div class="filter-chips">';
  html += '<button class="filter-chip ' + (activeFilter === 'all' ? 'active' : '') + '" onclick="setFilter(\'all\')">ALL</button>';
  values.forEach(v => {
    const count = COMMANDS.filter(c => c[key] === v).length;
    const safe = v.replace(/'/g, "\\'");
    const cls = activeFilter === v ? 'active' : '';
    html += '<button class="filter-chip ' + cls + '" onclick="setFilter(\'' + safe + '\')">' + escHtml(v) + ' <span style="opacity:0.5;font-size:10px">(' + count + ')</span></button>';
  });
  html += '</div>';
  area.innerHTML = html;
}

function renderResults() {
  const area = document.getElementById('results-area');
  if (!filtered.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x2298;</div><div class="empty-text">No commands found</div></div>';
    return;
  }
  const isGrouped = (currentMode === 'category' || currentMode === 'character') && activeFilter === 'all';
  if (isGrouped) {
    const key = currentMode === 'category' ? 'category' : 'pack';
    const groups = [...new Set(filtered.map(c => c[key]))].sort();
    area.innerHTML = groups.map(g => {
      const items = filtered.filter(c => c[key] === g);
      return '<div class="group-section">'
        + '<div class="group-header">'
        + '<div class="group-title">' + escHtml(g.toUpperCase()) + '</div>'
        + '<div class="group-count">' + items.length + ' COMMAND' + (items.length !== 1 ? 'S' : '') + '</div>'
        + '<div class="group-line"></div>'
        + '</div>'
        + '<div class="commands-grid">' + items.map(renderCard).join('') + '</div>'
        + '</div>';
    }).join('');
  } else {
    const start = (currentPage - 1) * PAGE_SIZE;
    area.innerHTML = '<div class="commands-grid">' + filtered.slice(start, start + PAGE_SIZE).map(renderCard).join('') + '</div>';
  }
}

function renderCard(cmd) {
  const shown = cmd.phrases.slice(0, 2);
  const more = cmd.phrases.length - 2;
  const phrasesHtml = shown.map(p => '<div class="cmd-phrase">' + escHtml(p) + '</div>').join('');
  const moreHtml = more > 0 ? '<div class="cmd-phrase" style="opacity:0.4;font-size:11px">+' + more + ' more phrase' + (more > 1 ? 's' : '') + '</div>' : '';
  return '<div class="cmd-card" onclick="openModal(' + cmd.id + ')">'
    + '<div class="cmd-card-accent"></div><div class="cmd-card-corner"></div>'
    + '<div class="cmd-card-header"><div class="cmd-category-badge">' + escHtml(cmd.category) + '</div></div>'
    + '<div class="cmd-card-body">'
    + '<div class="cmd-name">' + escHtml(cmd.name) + '</div>'
    + '<div class="cmd-voice-phrases">' + phrasesHtml + moreHtml + '</div>'
    + '<div class="cmd-card-divider"></div>'
    + '<div class="cmd-card-footer">'
    + '<div class="cmd-pack-badge">' + escHtml(cmd.pack) + '</div>'
    + '<div class="cmd-id">CMD-' + String(cmd.id).padStart(3, '0') + '</div>'
    + '</div></div></div>';
}

function renderPagination() {
  const pag = document.getElementById('pagination-area');
  const isGrouped = (currentMode === 'category' || currentMode === 'character') && activeFilter === 'all';
  if (isGrouped) { pag.innerHTML = ''; return; }
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  if (total <= 1) { pag.innerHTML = ''; return; }
  let html = '<div class="pagination">';
  html += '<button class="page-btn" onclick="goPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>&#x2190;</button>';
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || (i >= currentPage - 1 && i <= currentPage + 1))
      html += '<button class="page-btn ' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    else if (i === currentPage - 2 || i === currentPage + 2)
      html += '<span class="page-ellipsis">&#x2026;</span>';
  }
  html += '<button class="page-btn" onclick="goPage(' + (currentPage + 1) + ')" ' + (currentPage === total ? 'disabled' : '') + '>&#x2192;</button>';
  html += '</div>';
  pag.innerHTML = html;
}

function goPage(p) {
  currentPage = p; renderApp();
  document.getElementById('results-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function openModal(id) {
  const cmd = COMMANDS.find(c => c.id === id);
  if (!cmd) return;
  const phrasesHtml = cmd.phrases.map(p => '<div class="modal-phrase-item">' + escHtml(p) + '</div>').join('');
  const packBadge = '<div style="display:inline-block;padding:3px 10px;font-family:Share Tech Mono,monospace;font-size:10px;letter-spacing:2px;color:#88aaff;background:rgba(136,170,255,0.08);border:1px solid rgba(136,170,255,0.2);clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%)">' + escHtml(cmd.pack) + '</div>';
  document.getElementById('modal-content').innerHTML =
    '<div class="modal-header">'
    + '<div class="modal-badge-row"><div class="cmd-category-badge">' + escHtml(cmd.category) + '</div>' + packBadge + '</div>'
    + '<div class="modal-cmd-name">' + escHtml(cmd.name) + '</div>'
    + '<div class="modal-cmd-sub">' + escHtml(cmd.pack) + ' &nbsp;&middot;&nbsp; CMD-' + String(cmd.id).padStart(3, '0') + '</div>'
    + '</div>'
    + '<div class="modal-body">'
    + '<div class="modal-section-label">Voice Trigger Phrases</div>'
    + '<div class="modal-phrases-list">' + phrasesHtml + '</div>'
    + '<div class="modal-section-label">Command Details</div>'
    + '<div class="modal-info-rows">'
    + '<div class="modal-info-row"><div class="modal-info-key">Category</div><div class="modal-info-val">' + escHtml(cmd.category) + '</div></div>'
    + '<div class="modal-info-row"><div class="modal-info-key">Character / Pack</div><div class="modal-info-val">' + escHtml(cmd.pack) + '</div></div>'
    + '<div class="modal-info-row"><div class="modal-info-key">Total Phrases</div><div class="modal-info-val" style="color:var(--accent-cyan)">' + cmd.phrases.length + '</div></div>'

    + '</div></div>';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal')) closeModal(); }
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.getElementById('search-input').addEventListener('input', () => { currentPage = 1; renderApp(); });

    }));

  function draw() {

    stars.forEach(s => {
      s.twinkle += 0.01;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200,220,240,' + (s.opacity * (0.7 + 0.3 * Math.sin(s.twinkle))) + ')';
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); draw();
  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
